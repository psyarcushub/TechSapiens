<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101116" />
    <meta name="description" content="Стартап, который собирают участники конференции вместе с ИИ-агентом Гермесом." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>TechSapiens</title>
    <style>
      html { background: #f7f7fa; color: #15161c; }
      @media (prefers-color-scheme: dark) { html { background: #101116; color: #f2f2f6; } }
      .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .boot-dot { width: 44px; height: 44px; border-radius: 14px; background: #5b5bd6; animation: boot-pulse 1.2s ease-in-out infinite; }
      .boot-text { margin: 0; font-size: 16px; opacity: .7; }
      .boot-late { margin: 0; max-width: 300px; font-size: 14px; opacity: 0; animation: boot-show .3s ease 12s forwards; }
      @keyframes boot-pulse { 0%, 100% { transform: scale(.85); opacity: .6; } 50% { transform: scale(1); opacity: 1; } }
      @keyframes boot-show { to { opacity: .7; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <div class="boot-dot"></div>
        <p class="boot-text">Загружаем стартап…</p>
        <p class="boot-late">Загрузка затянулась. Если ничего не появится, обновите страницу.</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
